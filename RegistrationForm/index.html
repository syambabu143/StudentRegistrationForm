<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Registration</h1>

    <!-- Added id -->
    <form id="studentForm">

        <table>

            <tr>
                <td><label for="name">Full Name</label></td>
                <td><input type="text" id="name" placeholder="e.g. Syam Babu"></td>
            </tr>

            <tr>
                <td><label for="email">Email Address</label></td>
                <td><input type="email" id="email" placeholder="e.g. syam@example.com"></td>
            </tr>

            <tr>
                <td><label for="phone">Phone Number</label></td>
                <td><input type="tel" id="phone" placeholder="e.g. 9874563210"></td>
            </tr>

            <tr>
                <td><label for="department">Department</label></td>
                <td>
                    <select id="department">
                        <option value="">Select your department</option>
                        <option>Computer Science</option>
                        <option>Electronics</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="year">Year of Study</label></td>
                <td>
                    <select id="year">
                        <option value="">Select year</option>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </td>
            </tr>

        </table>

        <br>

        <button type="submit">Register</button>

    </form>

</div>

<!-- Move script here -->
<script>
document.getElementById("studentForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let department = document.getElementById("department").value;
    let year = document.getElementById("year").value;

    // Check if any field is empty
    if (name === "" || email === "" || phone === "" || department === "" || year === "") {
        alert("Please fill all the details.");
        return;
    }

    alert(
        "Student Registration Successful!\n\n" +
        "Full Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Phone: " + phone + "\n" +
        "Department: " + department + "\n" +
        "Year: " + year
    );

});
</script>

</body>
</html>
